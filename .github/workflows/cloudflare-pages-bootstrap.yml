name: Cloudflare Pages bootstrap

# One-time ops helper: creates (or confirms) the Cloudflare Pages Direct
# Upload project and lists existing projects. Manual only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Create or confirm the Pages project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-pages
    steps:
      - name: Create or confirm kids-ai-resource-hub (production branch: main)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create kids-ai-resource-hub --production-branch main

      - name: List Pages projects
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project list
