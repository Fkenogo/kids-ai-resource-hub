name: Cloudflare Pages deploy

# Manually triggered only. Uploads a previously verified dist artifact from an
# approved main commit to the named Cloudflare Pages Direct Upload project.
# Never runs automatically; DNS/Cloudflare domain changes are out of scope.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Approved main commit to deploy (full SHA; must have a successful Build run)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify artifact and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-pages
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify the commit is an ancestor of main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.commit_sha }}" origin/main \
            || { echo "::error::${{ inputs.commit_sha }} is not on main"; exit 1; }
          echo "Commit is on main."

      - name: Verify Cloudflare settings are present on the environment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CF_PAGES_PROJECT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Environment variable $name is missing on the cloudflare-pages environment"
              missing=1
            fi
          done
          # CLOUDFLARE_PAGES_EDIT_TOKEN is an environment secret; a missing
          # token fails at the deploy step (secrets cannot be inspected here).
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing values under Settings → Environments → cloudflare-pages."
            exit 1
          fi
          echo "Cloudflare environment variables present."

      - name: Locate the successful Build run for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ inputs.commit_sha }}&status=success" \
            --jq '.workflow_runs[] | select(.name == "Build") | .id' | head -1)
          if [ -z "$run_id" ]; then
            echo "::error::No successful Build run found for ${{ inputs.commit_sha }}. Run the Build workflow on main first."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the verified dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.commit_sha }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Verify artifact identity and hygiene
        run: |
          set -euo pipefail
          actual=$(cat dist/COMMIT_SHA)
          echo "COMMIT_SHA in artifact: $actual"
          if [ "$actual" != "${{ inputs.commit_sha }}" ]; then
            echo "::error::Artifact COMMIT_SHA ($actual) does not match the approved commit"
            exit 1
          fi
          if grep -rq "__identity-probe" dist/assets 2>/dev/null; then
            echo "::error::Emulator probe leaked into the production bundle"
            exit 1
          fi
          if grep -rq "VITE_FIREBASE_USE_EMULATOR" dist/assets 2>/dev/null; then
            echo "::error::Emulator flag leaked into the production bundle"
            exit 1
          fi
          echo "Artifact verified."

      - name: Deploy to Cloudflare Pages (Direct Upload)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_EDIT_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT_NAME }} --branch=main --commit-dirty=true

      - name: Report deployment URL
        run: echo "Check the wrangler output above for the pages.dev deployment URL."
